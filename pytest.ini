[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
env = 
    APP_TITLE=task_manager
    ENVIRONMENT=develompent
    IS_DEBUG=true
    DB_HOST=localhost
    DB_PORT=5432
    DB_USER=postgres
    DB_PASS=628926
    DB_NAME=test_tasks_manager
    JWT_SECRET_KEY=000000000000000000000000000000000000000000
    ACCESS_TOKEN_EXPIRE_MINUTES=10
    JWT_ALGORITHM=HS256
markers = 
    unit: Чистые юнит-тесты без подключения к чему-либо
    integration: Интерграционные тесты с подключением к БД и т.д.